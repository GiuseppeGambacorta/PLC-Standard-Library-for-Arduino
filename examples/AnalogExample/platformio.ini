[platformio]
default_envs = uno

[env]
framework = arduino
lib_deps =
    file://../..

[env:opta]
platform = ststm32
board = opta
build_flags = -I../../src

[env:uno]
platform = atmelavr
board = uno
build_flags = -I../../src

[env:esp32]
platform = espressif32
board = esp32dev
build_flags = -I../../src

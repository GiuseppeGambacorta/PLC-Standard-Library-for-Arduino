[platformio]
default_envs = opta

[env]
framework = arduino
lib_deps =
    file://../..

[env:opta]
platform = ststm32
board = opta
build_flags = -DTRIG_BUTTON_PIN=BTN_USER -I../../src

[env:uno]
platform = atmelavr
board = uno
build_flags = -DTRIG_BUTTON_PIN=2 -I../../src

[env:esp32]
platform = espressif32
board = esp32dev
build_flags = -DTRIG_BUTTON_PIN=0 -I../../src

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -I../../src

lib_deps =
    file://../..

[env:opta]
platform = ststm32
board = opta
framework = arduino
test_framework = unity
test_build_src = yes
lib_ignore = Unity
build_flags = -I../../src

lib_deps =
    file://../..

[env:uno]
platform = atmelavr
board = uno
framework = arduino
test_framework = unity
test_build_src = yes
lib_ignore = Unity
build_flags = -I../../src

lib_deps =
    file://../..

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
test_build_src = yes
lib_ignore = Unity
build_flags = -I../../src

lib_deps =
    file://../..
